<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Аналитика банковского сектора — форма 101 / форма 102 / капитал</title>
<style>
  :root{--bg:#0f1420;--panel:#161d2e;--panel2:#1c2438;--border:#2a3450;--text:#e7ebf3;--muted:#8a92a8;--accent:#4f8cff;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;}
  .topbar{
    display:flex;align-items:center;gap:22px;padding:0 20px;
    background:var(--panel);border-bottom:1px solid var(--border);
  }
  .topbar h1{font-size:16px;font-weight:600;margin:0;white-space:nowrap;padding:16px 0;}
  .tabs{display:flex;gap:4px;height:100%;}
  .tab{
    background:transparent;color:var(--muted);border:none;
    padding:16px 18px;font-size:14px;cursor:pointer;
    border-bottom:3px solid transparent;
  }
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600;}
  .frame-wrap{height:calc(100vh - 53px);}
  iframe{width:100%;height:100%;border:0;display:block;}
</style>
</head>
<body>

  <div class="topbar">
    <h1>Аналитика банковского сектора РФ</h1>
    <div class="tabs">
      <button class="tab active" data-src="form101/index.html" id="tab101">Прибыль (форма 101)</button>
      <button class="tab" data-src="form102/index.html" id="tab102">CIR (форма 102)</button>
      <button class="tab" data-src="form_capital/index.html" id="tabCapital">Капитал, ROE / ROA</button>
    </div>
  </div>

  <div class="frame-wrap">
    <iframe id="contentFrame" src="form101/index.html"></iframe>
  </div>

<script>
const frame = document.getElementById('contentFrame');
const tabs = document.querySelectorAll('.tab');
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    frame.src = tab.dataset.src;
  });
});
</script>
</body>
</html>
