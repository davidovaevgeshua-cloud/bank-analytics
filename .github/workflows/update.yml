name: Обновление данных CIR

on:
  schedule:
    # каждый день в 06:00 UTC (09:00 по Москве)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей (dbfread, unrar)
        run: |
          pip install dbfread
          sudo apt-get update
          sudo apt-get install -y unrar || sudo apt-get install -y unrar-free

      - name: Запуск обновления
        run: python scripts/update_data.py

      - name: Коммит и пуш изменений (если есть)
        run: |
          git config user.name "cir-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ index.html
          git diff --cached --quiet && echo "Изменений нет" || git commit -m "Автообновление данных CIR"
          git push
