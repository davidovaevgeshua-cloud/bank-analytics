name: Обновление данных (CIR + кредитный портфель ЮЛ/ФЛ)

on:
  schedule:
    # каждый день в 06:00 UTC (09:00 по Москве)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей (dbfread, openpyxl, unrar)
        run: |
          pip install dbfread openpyxl
          sudo apt-get update
          sudo apt-get install -y unrar || sudo apt-get install -y unrar-free

      - name: Обновление CIR (форма 102)
        run: python scripts/update_data.py

      - name: Обновление кредитного портфеля ЮЛ/ФЛ (вкладка "Капитал")
        run: python scripts/update_loans_flul.py

      - name: Коммит и пуш изменений (если есть)
        run: |
          git config user.name "bank-analytics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ form102/index.html form_capital/index.html
          git diff --cached --quiet && echo "Изменений нет" || git commit -m "Автообновление данных (CIR + кредитный портфель ЮЛ/ФЛ)"
          git push
