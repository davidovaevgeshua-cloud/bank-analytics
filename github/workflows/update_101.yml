name: Обновление данных прибыли (форма 101)

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей (dbfread, unrar)
        run: |
          pip install dbfread
          sudo apt-get update
          sudo apt-get install -y unrar || sudo apt-get install -y unrar-free

      - name: Запуск обновления
        run: python scripts/update_data_101.py

      - name: Коммит и пуш изменений (если есть)
        run: |
          git config user.name "profit101-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/profit_history_101.json data/state_101.json form101/index.html
          git diff --cached --quiet && echo "Изменений нет" || git commit -m "Автообновление данных формы 101"
          git push
